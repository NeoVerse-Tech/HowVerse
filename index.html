<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>Howverse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/loader.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/sector.css">
<link rel="stylesheet" href="css/topic.css">
</head>
<body class="booting">
<canvas id="gl"></canvas>
<div id="app"></div>

<!-- Loader is plain HTML so the animation starts the moment the page paints -->
<div class="ld" id="ld">
  <h1 aria-label="Howverse">
    <span style="--i:0">H</span><span style="--i:1">O</span><span style="--i:2">W</span><span style="--i:3">V</span><span style="--i:4">E</span><span style="--i:5">R</span><span style="--i:6">S</span><span style="--i:7">E</span>
  </h1>
  <div class="st" id="ldMsg">Igniting the simulation</div>
  <div class="bar"><i id="ldBar"></i></div>
  <div class="pc" id="ldPc">0%</div>
  <button class="skip" id="ldSkip">Tap to skip</button>
</div>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/vue-router/4.3.0/vue-router.global.min.js"></script>

<!-- Your files. Order matters: data, scene, loader, pages, app -->
<script defer src="js/data/sectors.js"></script>
<script defer src="js/core/scene.js"></script>
<script defer src="js/ui/loader.js"></script>
<script defer src="js/ui/home.js"></script>
<script defer src="js/ui/sector.js"></script>
<script defer src="js/ui/topic.js"></script>
<script defer src="js/topics/flight/spaceship.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
